name: Deploy Website

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        targets: wasm32-unknown-unknown

    - uses: Swatinem/rust-cache@v2

    - name: Lint
      run: cargo clippy --all-targets -- -D warnings

    - name: Test
      run: cargo test --all

    - name: Fetch resume
      env:
        GITHUB_TOKEN: ${{ secrets.RESUME_GITHUB_TOKEN }}
      run: ./scripts/fetch-resume.sh

    - name: Install poppler
      run: sudo apt-get update && sudo apt-get install -y poppler-utils

    - name: Render resume
      run: ./scripts/render-resume.sh

    - name: Install wasm-bindgen-cli
      run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

    - name: Build WebAssembly
      run: ./scripts/build-wasm.sh

    - name: Build site
      run: cargo run -p site -- --strict

    - name: Verify wasm shipped
      run: |
        test -f dist/demos/reaction-diffusion/reaction_diffusion_bg.wasm
        test -f dist/demos/reaction-diffusion/reaction_diffusion.js
        ls -la dist/demos/reaction-diffusion/
        test -f dist/demos/aho-corasick/aho_corasick_demo_bg.wasm
        test -f dist/demos/aho-corasick/aho_corasick_demo.js
        grep -q 'aho-loader.js' dist/demos/aho-corasick/index.html

    - name: Verify resume shipped
      run: |
        test -f dist/resume/page-01.svg
        test -f dist/assets/paul_maxwell_resume.pdf
        grep -q 'class="resume-page" src="/resume/page-01.svg"' dist/resume/index.html
        ls -la dist/resume/

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
