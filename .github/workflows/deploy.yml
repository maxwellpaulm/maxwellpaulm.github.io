name: Deploy Website

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      with:
        components: clippy
        targets: wasm32-unknown-unknown

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Lint
      run: cargo clippy --all-targets -- -D warnings

    - name: Test
      run: cargo test --all

    - name: Fetch resume
      env:
        GITHUB_TOKEN: ${{ secrets.RESUME_GITHUB_TOKEN }}
      run: ./scripts/fetch-resume.sh

    - name: Install poppler
      run: sudo apt-get update && sudo apt-get install -y poppler-utils

    - name: Render resume
      run: ./scripts/render-resume.sh

    - name: Install wasm-bindgen-cli
      run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

    - name: Build WebAssembly
      run: ./scripts/build-wasm.sh

    - name: Build site
      run: cargo run -p site -- --strict

    - name: Verify CSP hashes
      run: ./scripts/check-csp-hashes.sh

    - name: Verify wasm shipped
      run: |
        test -f dist/demos/reaction-diffusion/reaction_diffusion_bg.wasm
        test -f dist/demos/reaction-diffusion/reaction_diffusion.js
        ls -la dist/demos/reaction-diffusion/
        test -f dist/demos/aho-corasick/aho_corasick_demo_bg.wasm
        test -f dist/demos/aho-corasick/aho_corasick_demo.js
        grep -q 'src="/demos/aho-loader.js"' dist/demos/aho-corasick/index.html

    - name: Verify resume shipped
      run: |
        test -f dist/resume/page-01.svg
        test -f dist/assets/paul_maxwell_resume.pdf
        grep -q 'class="resume-page" src="/resume/page-01.svg"' dist/resume/index.html
        ls -la dist/resume/

    - name: Setup Pages
      uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

    - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      with:
        path: 'dist'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write # required by actions/deploy-pages to publish the build
      id-token: write # required by actions/deploy-pages for OIDC auth
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
